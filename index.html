<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constelaciones Familiares - Lainez 3D Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1f1b18;
      color: #f5efe6;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* Paneles Flotantes */
    .panel {
      position: absolute;
      z-index: 10;
      background: rgba(35, 30, 27, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 163, 115, 0.3);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      max-height: 90vh;
      overflow-y: auto;
    }
    #sync-panel {
      top: 20px;
      left: 20px;
      width: 290px;
    }
    #controls-panel {
      top: 20px;
      right: 20px;
      width: 320px;
    }
    #inspector-panel {
      bottom: 20px;
      left: 20px;
      width: 350px;
      display: none;
    }
    h2, h3 {
      color: #e6ccb2;
      margin-bottom: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: #ddb892;
      margin-bottom: 4px;
    }
    input, select, button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #7f5539;
      background: #2e2621;
      color: #f5efe6;
      font-size: 0.85rem;
      outline: none;
    }
    button {
      background: #b08968;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin-top: 4px;
    }
    button:hover {
      background: #9c6644;
    }
    .btn-secondary {
      background: #588157;
    }
    .btn-secondary:hover {
      background: #3a5a40;
    }
    .btn-danger {
      background: #9a031e;
    }
    .btn-danger:hover {
      background: #5f0f40;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn-group button {
      flex: 1;
    }
    #room-info {
      margin-top: 8px;
      padding: 8px;
      background: rgba(230, 204, 178, 0.08);
      border-radius: 6px;
      font-size: 0.8rem;
      text-align: center;
    }
    #notification {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 10px 24px;
      border-radius: 20px;
      background: #b08968;
      color: white;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      display: none;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      background: rgba(255,255,255,0.1);
      margin-left: 4px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="notification">Notificación</div>

  <!-- Panel de Sincronización Backend -->
  <div id="sync-panel" class="panel">
    <h2>Sincronización en Vivo</h2>
    <div class="input-group">
      <label for="user-name">Tu Nombre / Rol:</label>
      <input type="text" id="user-name" placeholder="Ej. Terapeuta">
    </div>
    <button id="btn-create-room" class="btn-secondary">Crear Nueva Sala</button>

    <div style="margin: 10px 0; text-align: center; font-size: 0.75rem; color: #ddb892;">— O ÚNETE A UNA —</div>

    <div class="input-group">
      <label for="room-code-input">Código de Sala:</label>
      <input type="text" id="room-code-input" placeholder="Ej. X8A2K9">
    </div>
    <button id="btn-join-room">Unirse a Sala</button>

    <div id="room-info">Estado: Modo local activo</div>
  </div>

  <!-- Panel de Creación de Representantes -->
  <div id="controls-panel" class="panel">
    <h2>Añadir Representante</h2>
    <div class="input-group">
      <label>Rol / Nombre del Familiar:</label>
      <input type="text" id="avatar-label" placeholder="Ej. Madre, Padre, Yo, Anhelo">
    </div>
    <div class="input-group">
      <label>Forma Humana / Representación:</label>
      <select id="avatar-gender">
        <option value="adult-m">Hombre Adulto</option>
        <option value="adult-f">Mujer Adulta</option>
        <option value="child-m">Niño</option>
        <option value="child-f">Niña</option>
        <option value="abstract">Elemento Abstracto / Síntoma</option>
      </select>
    </div>
    <button id="add-avatar" class="btn-secondary">+ Introducir al Campo</button>
    <hr style="border-color: rgba(212,163,115,0.2); margin: 12px 0;">
    <div class="btn-group">
      <button id="btn-screenshot">📷 Capturar Campo</button>
      <button id="clear-board" class="btn-danger">Limpiar</button>
    </div>
  </div>

  <!-- Panel Inspector de Figura Seleccionada -->
  <div id="inspector-panel" class="panel">
    <h2>Propiedades <span id="insp-title" class="badge"></span></h2>
    
    <div class="input-group">
      <label>Etiqueta / Nombre:</label>
      <input type="text" id="insp-label">
    </div>

    <div class="input-group">
      <label>Postura Sistémica:</label>
      <select id="insp-posture">
        <option value="standing">De Pie (Presencia)</option>
        <option value="bowing">Inclinado / Reverencia (Respeto/Honra)</option>

        <option value="lying">Tumbado (Fallecido / Excluido / Distancia)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Estado / Aura Emocional:</label>
      <select id="insp-emotion">
        <option value="neutral">Neutro (Tono Calido)</option>
        <option value="love">Amor / Vinculo (Verde Esmeralda)</option>
        <option value="grief">Tristeza / Duelo (Azul Profundo)</option>
        <option value="anger">Enojo / Fuerza (Rojo Terracota)</option>
        <option value="fear">Miedo / Tensión (Violeta)</option>
        <option value="exclusion">Exclusión (Sombra Oscura)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Orientación / Mirada (Grados):</label>
      <input type="range" id="insp-rotation" min="0" max="360" value="0">
    </div>

    <div class="input-group">
      <label>Escala / Proporción de Tamaño:</label>
      <input type="range" id="insp-scale" min="50" max="150" value="100">
    </div>

    <div class="btn-group">
      <button id="insp-deselect">Deseleccionar</button>
      <button id="insp-delete" class="btn-danger">Eliminar</button>
    </div>
  </div>

  <!-- Firebase v10 ESM Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAP8f8_XIDwprNnJRuKX24AJjvy26CW9Bs",
      authDomain: "lainez-3d.firebaseapp.com",
      projectId: "lainez-3d",
      storageBucket: "lainez-3d.firebasestorage.app",
      messagingSenderId: "60308784880",
      appId: "1:60308784880:web:8ac971ae4bf9ff105fa435"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentRoomId = null;
    let isRemoteUpdate = false;
    let selectedAvatar = null;

    signInAnonymously(auth)
      .then(() => showNotif("Conectado a Firebase"))
      .catch((err) => console.error("Error Auth:", err));

    function showNotif(msg) {
      const notif = document.getElementById('notification');
      notif.innerText = msg;
      notif.style.display = 'block';
      setTimeout(() => { notif.style.display = 'none'; }, 2800);
    }

    // --- ESCENA THREE.JS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1f1b18);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 16, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación
    const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffe8d6, 0.9);
    dirLight.position.set(12, 24, 12);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Tablero Madera
    const boardGeo = new THREE.CylinderGeometry(9, 9, 0.4, 64);
    const boardMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.5 });
    const board = new THREE.Mesh(boardGeo, boardMat);
    board.position.y = -0.2;
    board.receiveShadow = true;
    scene.add(board);

    // Plano invisible para Drag & Drop
    const dragPlaneGeo = new THREE.PlaneGeometry(100, 100);
    dragPlaneGeo.rotateX(-Math.PI / 2);
    const dragPlane = new THREE.Mesh(dragPlaneGeo, new THREE.MeshBasicMaterial({ visible: false }));
    scene.add(dragPlane);

    // Halo de Selección
    const selectHaloGeo = new THREE.RingGeometry(0.6, 0.8, 32);
    selectHaloGeo.rotateX(-Math.PI / 2);
    const selectHaloMat = new THREE.MeshBasicMaterial({ color: 0xffd166, side: THREE.DoubleSide });
    const selectHalo = new THREE.Mesh(selectHaloGeo, selectHaloMat);
    selectHalo.visible = false;
    scene.add(selectHalo);

    // Avatares y Paleta
    const avatars = [];
    const EMOTION_COLORS = {
      neutral: 0xd4a373,
      love: 0x2a9d8f,
      grief: 0x457b9d,
      anger: 0xe76f51,
      fear: 0x7209b7,
      exclusion: 0x212529
    };

    // --- CONSTRUCTOR DE FIGURA HUMANA ARTICULADA ---
    function buildHumanMesh(type = 'adult-m') {
      const group = new THREE.Group();
      const bodyGroup = new THREE.Group(); // Subgrupo articulable para posturas
      group.add(bodyGroup);

      let isChild = type.includes('child');
      let isFemale = type.includes('-f');
      let isAbstract = type === 'abstract';

      let scaleY = isChild ? 0.65 : 1.0;
      let scaleXZ = isChild ? 0.75 : 1.0;
      let baseColor = isFemale ? 0xddb892 : 0xd4a373;
      if (isAbstract) baseColor = 0x8d99ae;

      const mat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.35 });

      if (isAbstract) {
        // Objeto geométrico abstracto
        const geo = new THREE.OctahedronGeometry(0.8);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 1.0;
        mesh.castShadow = true;
        bodyGroup.add(mesh);
      } else {
        // === ANATOMÍA HUMANA ===
        // Torso / Pecho
        const torsoTopWidth = isFemale ? 0.32 : 0.42;
        const torsoGeo = new THREE.CylinderGeometry(torsoTopWidth * scaleXZ, 0.28 * scaleXZ, 0.8 * scaleY, 16);
        const torso = new THREE.Mesh(torsoGeo, mat);
        torso.position.y = (0.9 * scaleY) + (0.4 * scaleY);
        torso.castShadow = true;
        bodyGroup.add(torso);

        // Pelvis / Cadera
        const hipGeo = new THREE.CylinderGeometry(0.28 * scaleXZ, 0.22 * scaleXZ, 0.3 * scaleY, 16);
        const hip = new THREE.Mesh(hipGeo, mat);
        hip.position.y = (0.75 * scaleY);
        hip.castShadow = true;
        bodyGroup.add(hip);

        // Piernas
        const legGeo = new THREE.CylinderGeometry(0.1 * scaleXZ, 0.08 * scaleXZ, 0.75 * scaleY, 16);
        const legL = new THREE.Mesh(legGeo, mat);
        legL.position.set(-0.13 * scaleXZ, 0.375 * scaleY, 0);
        legL.castShadow = true;
        bodyGroup.add(legL);

        const legR = new THREE.Mesh(legGeo, mat);
        legR.position.set(0.13 * scaleXZ, 0.375 * scaleY, 0);
        legR.castShadow = true;
        bodyGroup.add(legR);

        // Cuello y Cabeza
        const headGeo = new THREE.SphereGeometry(0.32 * scaleXZ, 32, 32);
        const head = new THREE.Mesh(headGeo, mat);
        head.position.y = (1.3 * scaleY) + (0.32 * scaleXZ) + 0.1;
        head.castShadow = true;
        bodyGroup.add(head);

        // Nariz / Vector de Mirada
        const gazeGeo = new THREE.ConeGeometry(0.08 * scaleXZ, 0.25, 16);
        gazeGeo.rotateX(Math.PI / 2);
        const gazeMat = new THREE.MeshStandardMaterial({ color: 0x5c3d2e });
        const gaze = new THREE.Mesh(gazeGeo, gazeMat);
        gaze.position.set(0, head.position.y, 0.35 * scaleXZ);
        bodyGroup.add(gaze);
      }

      // Anillo Aura Emocional
      const auraGeo = new THREE.RingGeometry(0.55 * scaleXZ, 0.75 * scaleXZ, 32);
      auraGeo.rotateX(-Math.PI / 2);
      const auraMat = new THREE.MeshBasicMaterial({ color: EMOTION_COLORS.neutral, side: THREE.DoubleSide });
      const aura = new THREE.Mesh(auraGeo, auraMat);
      aura.position.y = 0.02;
      group.add(aura);

      // ---
